<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30-text-shadow</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            p.txt {
                font-size: 2rem;
                text-align: center;
                margin-block: 4rem;

                &.txt1 {
                    color: black;
                    text-shadow: 0 0 6px #fff;
                }
                &.txt2 {
                    color: black;
                    text-shadow: -4px -4px 10px #fff;
                }

                &.txt3 {
                    font-size: 4rem;
                    color: black;
                    text-shadow: 
                    1px 1px 0px #fff,
                    2px 2px 0px #fff,
                    3px 3px 0px #fff,
                    4px 4px 0px #fff,
                    5px 5px 0px #fff,
                    6px 6px 0px #fff,
                    8px 8px 15px rgba(0, 0, 0, 0.6);
                }

                &.txt4 {
                    color: #ffcc00; 
                    font-size: 3rem; 
                    font-weight: bold;
                text-shadow: 
                1px 1px 0px rgba(0,0,0,0.5), 
                0 0 5px #ffcc00,    
                0 0 10px #ff9900,   
                0 0 20px #ff3300,   
                0 0 40px #ff0000;   
                }
            }
        }
    </style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
    </a>
    <main>
        <header>
            <h1>30-text-shadow</h1>
            <h4> Property that adds shadow effects directly to text content, taking values for offset, blur radius, and color.</h4>
        </header>

        <section>
            <p class="txt txt1">ADSO</p>
            <p class="txt txt2">C.P.I.C</p>
            <p class="txt txt3">SENA</p>
            <p class="txt txt4">Caldas</p>
        </section>

    </main>
</body>
</html>
