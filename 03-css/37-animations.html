<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>37-animations</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            div.jungle {
                background: url(imgs/jungle.png) no-repeat center / cover;
                margin: 0 auto;
                position: relative;
                height: 390px;
                width: 320px;
                overflow: hidden; 

                img.logo {
                    position: absolute;
                    transform: scale(.5);
                    animation: 1s animLogo ease-in infinite;
                    top: 10px;
                }

                img.dk {
                    position: absolute;
                    left: 90px;
                    top: 140px;
                    width: 140px;
                    animation: 2s animDk ease-in infinite;
                }

                div.move {
                    position: absolute;
                    top: 240px;
                    left: 0;
                    animation: 4s animMove ease-out infinite;

                    img.ryno {
                        position: relative; 
                        width: 140px;
                        object-fit: contain;
                        animation: 0.2s animRyno linear infinite;
                    }
                }
            }
        }

        @keyframes animLogo {
            0%, 100% {
                transform: scale(.5); 
            }
            50% {
                transform: scale(1);
            }
        }

        @keyframes animDk {
            0% {
                transform: translateY(-80px) rotateX(0deg);
            }
            40% {
                transform: translateY(0px) rotateX(0deg);
            }
            50% {
                transform: translateY(0px) rotateX(180deg);
            }
            60% {
                transform: translateY(0px) rotateX(0deg);
            }
            100% {
                transform: translateY(-80px) rotateX(0deg);
            }
        } 

        @keyframes animRyno {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px); 
            }
        }

        @keyframes animMove {
            0% {
                top: 240px;
                left: -140px;
                transform: rotateY(0deg);
            }
            40% {
                top: 240px;
                left: 320px;
                transform: rotateY(0deg);
            }
            50% {
                top: 240px;
                left: 320px;
                transform: rotateY(180deg);
            }
            90% {
                top: 240px;
                left: -140px;
                transform: rotateY(180deg);
            }
            100% {
                top: 240px;
                left: -140px;
                transform: rotateY(0deg);
            }
        }
    </style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
    </a>
    <main>
        <header>
            <h1>37-animations</h1>
            <h4>Feature using @keyframes to create multi-step keyframed visual changes without JavaScript intervention.</h4>
        </header>

        <section>
            <div class="jungle">
                <img src="imgs/logo-dk.png" class="logo">
                <img src="imgs/dk.png" class="dk">
                <div class="move">
                    <img src="imgs/ryno.png" class="ryno">
                </div>
            </div>
        </section>
    </main>
</body>
</html>
