<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32-Clip Path</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
    div.clip {
        background: url(imgs/real-madrid.png) no-repeat center/cover;
        border-radius: 14px;
        margin: 0 auto;
        height: 300px;
        width: 300px;
        transition: all 0.4s ease-in;

        &.clip1 {
            clip-path: polygon(10% 25%, 43% 33%, 35% 0%, 65% 0%, 58% 33%, 90% 25%, 90% 50%, 59% 47%, 68% 100%, 31% 100%, 42% 47%, 10% 50%);

            &:hover {
                clip-path: polygon(0 19%, 0 0, 35% 0%, 65% 0%, 100% 0, 100% 0, 100% 58%, 100% 100%, 68% 100%, 31% 100%, 0 100%, 0 53%);
            }
        }
        &.clip2 {
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);

            &:hover {
                clip-path: polygon(50% 0%, 100% 0, 100% 35%, 100% 59%, 100% 100%, 50% 100%, 0 100%, 0 87%, 0 34%, 0 0);
            }
        }

    }
</style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
        </svg>
    </a>
    <main>
        <header>
            <h1>32-Clip Path</h1>
            <h2>Property lets you clip an element to a basic shape.</h2>
        </header>

        <section class="clip-section">
            <h4>Example 01:</h4>
            <div class="clip clip1"></div>
            <h4>Example 02:</h4>
            <div class="clip clip2"></div>
        </section>

    </main>
</body>
</html>
